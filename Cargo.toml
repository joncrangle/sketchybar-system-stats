[package]
name = "stats_provider"
version = "0.9.1"
description = "A simple system stats event provider for Sketchybar."
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
libc = "0.2"
starship-battery = "0.11.1"
sysinfo = { version = "0.39.6", default-features = false, features = [
  "component",
  "disk",
  "network",
  "system",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[build-dependencies]
cc = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
